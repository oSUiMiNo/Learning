<svg viewBox="0 0 720 330" role="img" aria-label="やりたいことから使うウィジェットを引くための地図。">
  <rect x="1" y="1" width="718" height="328" rx="14" class="d-box-plain"/>

  <text x="30" y="32" class="d-head-accent">やりたいことから引く — ウィジェット早見地図</text>

  <rect x="30" y="48" width="212" height="126" rx="10" class="d-accent"/>
  <text x="48" y="74" class="d-title">操作させたい</text>
  <text x="48" y="100" class="d-code">QPushButton</text>
  <text x="48" y="120" class="d-code">QCheckBox</text>
  <text x="48" y="140" class="d-code">QRadioButton</text>
  <text x="48" y="160" class="d-mute">押す・切り替える・ひとつ選ぶ</text>

  <rect x="254" y="48" width="212" height="126" rx="10" class="d-tip"/>
  <text x="272" y="74" class="d-title">入力させたい</text>
  <text x="272" y="100" class="d-code">QLineEdit</text>
  <text x="272" y="120" class="d-code">QSpinBox / QDateEdit</text>
  <text x="272" y="140" class="d-code">QPlainTextEdit</text>
  <text x="272" y="160" class="d-mute">1 行・数値・日付・複数行</text>

  <rect x="478" y="48" width="212" height="126" rx="10" class="d-deep"/>
  <text x="496" y="74" class="d-title">選ばせたい</text>
  <text x="496" y="100" class="d-code">QComboBox</text>
  <text x="496" y="120" class="d-code">QListWidget</text>
  <text x="496" y="140" class="d-code">QSlider / QDial</text>
  <text x="496" y="160" class="d-mute">候補が少ない / 多い / 連続値</text>

  <rect x="30" y="190" width="212" height="126" rx="10" class="d-warn"/>
  <text x="48" y="216" class="d-title">見せたい</text>
  <text x="48" y="242" class="d-code">QLabel</text>
  <text x="48" y="262" class="d-code">QProgressBar</text>
  <text x="48" y="282" class="d-code">QLCDNumber</text>
  <text x="48" y="302" class="d-mute">文字・画像・進み具合</text>

  <rect x="254" y="190" width="212" height="126" rx="10" class="d-box"/>
  <text x="272" y="216" class="d-title">まとめたい</text>
  <text x="272" y="242" class="d-code">QGroupBox</text>
  <text x="272" y="262" class="d-code">QTabWidget</text>
  <text x="272" y="282" class="d-code">QScrollArea / QSplitter</text>
  <text x="272" y="302" class="d-mute">囲む・切り替える・収める</text>

  <rect x="478" y="190" width="212" height="126" rx="10" class="d-box"/>
  <text x="496" y="216" class="d-title">たくさん並べたい</text>
  <text x="496" y="242" class="d-code">QListView</text>
  <text x="496" y="262" class="d-code">QTableView</text>
  <text x="496" y="282" class="d-code">QTreeView</text>
  <text x="496" y="302" class="d-mute">→ 第10章のモデル / ビューへ</text>
</svg>
