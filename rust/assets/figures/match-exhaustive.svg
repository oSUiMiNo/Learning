<svg viewBox="0 0 720 250" role="img" aria-label="match の網羅性検査。列挙型に選択肢を追加すると、対応していない match が全部コンパイルエラーになる。">
  <rect x="1" y="1" width="718" height="248" rx="14" class="d-box-plain"/>

  <text x="28" y="30" class="d-head-accent">列挙型に 1 つ足すと、直すべき場所が全部エラーになる</text>

  <!-- before -->
  <rect x="20" y="44" width="330" height="140" rx="10" class="d-tip"/>
  <text x="185" y="66" text-anchor="middle" class="d-title">いまの状態</text>
  <g class="d-code">
    <text x="44" y="92">enum Signal { Red, Green }</text>
    <text x="44" y="118">match s {</text>
    <text x="60" y="138">Red =&gt; ..,</text>
    <text x="60" y="158">Green =&gt; ..,</text>
    <text x="44" y="176">}   ← 網羅している</text>
  </g>

  <path d="M350 114 L390 114" class="d-flow-warn"/>
  <path d="M390 114 l-10 -5 v10 z" class="d-arrowhead-warn"/>
  <text x="370" y="104" text-anchor="middle" class="d-mute">Yellow を追加</text>

  <!-- after -->
  <rect x="390" y="44" width="310" height="140" rx="10" class="d-warn"/>
  <text x="545" y="66" text-anchor="middle" class="d-title">追加した直後</text>
  <g class="d-code">
    <text x="410" y="92">enum Signal { Red, Green, Yellow }</text>
    <text x="410" y="118">match s {</text>
    <text x="426" y="138">Red =&gt; ..,</text>
    <text x="426" y="158">Green =&gt; ..,</text>
  </g>
  <text x="410" y="176" class="d-head-warn">}   ← E0004 でここが止まる</text>

  <rect x="20" y="200" width="680" height="36" rx="10" class="d-dash"/>
  <text x="40" y="223" class="d-mute">C# の switch は default が無ければ黙って何もしない。Rust は「まだ考えていない場合」を残したままビルドできない。</text>
</svg>
