<svg viewBox="0 0 720 250" role="img" aria-label="Copy される型と move される型の違い。i32 は代入すると複製され両方使えるが、String は所有権が移り元が使えなくなる。">
  <rect x="1" y="1" width="718" height="248" rx="14" class="d-box-plain"/>

  <!-- Copy -->
  <rect x="20" y="20" width="330" height="210" rx="10" class="d-tip"/>
  <text x="185" y="44" text-anchor="middle" class="d-title">Copy される型</text>
  <text x="185" y="62" text-anchor="middle" class="d-code">i32, f64, bool, char, &amp;T …</text>

  <text x="44" y="88" class="d-code">let a = 10;</text>
  <text x="44" y="108" class="d-code">let b = a;</text>

  <rect x="48" y="122" width="120" height="44" rx="7" class="d-box"/>
  <text x="108" y="142" text-anchor="middle" class="d-code">a = 10</text>
  <text x="108" y="158" text-anchor="middle" class="d-head-tip">使える</text>

  <rect x="200" y="122" width="120" height="44" rx="7" class="d-box"/>
  <text x="260" y="142" text-anchor="middle" class="d-code">b = 10</text>
  <text x="260" y="158" text-anchor="middle" class="d-head-tip">使える</text>

  <path d="M168 144 L200 144" class="d-flow"/>
  <path d="M200 144 l-9 -5 v10 z" class="d-arrowhead"/>

  <text x="185" y="192" text-anchor="middle" class="d-mute">中身が小さいので、まるごと複製しても安い</text>
  <text x="185" y="212" text-anchor="middle" class="d-mute">C# の値型（struct, int）と同じ感覚</text>

  <!-- Move -->
  <rect x="370" y="20" width="330" height="210" rx="10" class="d-accent"/>
  <text x="535" y="44" text-anchor="middle" class="d-title">move される型</text>
  <text x="535" y="62" text-anchor="middle" class="d-code">String, Vec&lt;T&gt;, Box&lt;T&gt; …</text>

  <text x="394" y="88" class="d-code">let s = String::from("あ");</text>
  <text x="394" y="108" class="d-code">let t = s;</text>

  <rect x="398" y="122" width="120" height="44" rx="7" class="d-dead"/>
  <text x="458" y="142" text-anchor="middle" class="d-dead-text">s</text>
  <text x="458" y="158" text-anchor="middle" class="d-dead-text">使えない</text>
  <path d="M406 128 L510 160" class="d-strike"/>
  <path d="M510 128 L406 160" class="d-strike"/>

  <rect x="550" y="122" width="120" height="44" rx="7" class="d-box"/>
  <text x="610" y="142" text-anchor="middle" class="d-code">t</text>
  <text x="610" y="158" text-anchor="middle" class="d-head-accent">使える</text>

  <path d="M518 144 L550 144" class="d-flow"/>
  <path d="M550 144 l-9 -5 v10 z" class="d-arrowhead"/>

  <text x="535" y="192" text-anchor="middle" class="d-mute">中身はヒープにあるので、複製すると高い</text>
  <text x="535" y="212" text-anchor="middle" class="d-head-warn">複製したいときは明示的に .clone()</text>
</svg>
