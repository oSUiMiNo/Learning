<svg viewBox="0 0 720 290" role="img" aria-label="Box, Rc, Arc, RefCell, Mutex の使い分けを決めるフローチャート。">
  <rect x="1" y="1" width="718" height="288" rx="14" class="d-box-plain"/>

  <text x="28" y="30" class="d-head-accent">まず「所有者は 1 人で足りるか」を考える</text>

  <!-- 質問1 -->
  <rect x="24" y="46" width="200" height="60" rx="9" class="d-box"/>
  <text x="124" y="70" text-anchor="middle" class="d-title">持ち主は 1 人？</text>
  <text x="124" y="90" text-anchor="middle" class="d-mute">ふつうはこちら</text>

  <path d="M224 76 L282 76" class="d-flow"/>
  <path d="M282 76 l-10 -5 v10 z" class="d-arrowhead"/>
  <text x="253" y="66" text-anchor="middle" class="d-mute">はい</text>

  <rect x="282" y="46" width="180" height="60" rx="9" class="d-accent"/>
  <text x="372" y="70" text-anchor="middle" class="d-code">そのまま持つ</text>
  <text x="372" y="90" text-anchor="middle" class="d-mute">大きい / 再帰なら Box&lt;T&gt;</text>

  <path d="M124 106 L124 140" class="d-flow"/>
  <path d="M124 140 l-5 -9 h10 z" class="d-arrowhead"/>
  <text x="136" y="128" class="d-mute">いいえ</text>

  <!-- 質問2 -->
  <rect x="24" y="140" width="200" height="60" rx="9" class="d-box"/>
  <text x="124" y="164" text-anchor="middle" class="d-title">スレッドをまたぐ？</text>

  <path d="M224 170 L282 170" class="d-flow"/>
  <path d="M282 170 l-10 -5 v10 z" class="d-arrowhead"/>
  <text x="253" y="160" text-anchor="middle" class="d-mute">いいえ</text>
  <rect x="282" y="140" width="180" height="60" rx="9" class="d-tip"/>
  <text x="372" y="170" text-anchor="middle" class="d-code">Rc&lt;T&gt;</text>
  <text x="372" y="190" text-anchor="middle" class="d-mute">参照カウント（速い）</text>

  <path d="M462 170 L520 170" class="d-flow"/>
  <path d="M520 170 l-10 -5 v10 z" class="d-arrowhead"/>
  <text x="491" y="160" text-anchor="middle" class="d-mute">はい</text>
  <rect x="520" y="140" width="176" height="60" rx="9" class="d-deep"/>
  <text x="608" y="170" text-anchor="middle" class="d-code">Arc&lt;T&gt;</text>
  <text x="608" y="190" text-anchor="middle" class="d-mute">原子的なカウント</text>

  <!-- 書き換え -->
  <rect x="24" y="216" width="672" height="60" rx="9" class="d-dash"/>
  <text x="44" y="238" class="d-head-accent">共有したうえで書き換えたいなら、さらに内側に包む</text>
  <text x="44" y="258" class="d-code">単一スレッド: Rc&lt;RefCell&lt;T&gt;&gt;          複数スレッド: Arc&lt;Mutex&lt;T&gt;&gt;</text>
  <text x="440" y="272" class="d-mute">RefCell は借用の検査が実行時になるので、破ると panic する</text>
</svg>
